name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Duroosi.xcodeproj \
            -scheme Duroosi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error:" build.log | sort -u | head -40 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          gh release delete buildlog --yes --cleanup-tag || true
          gh release create buildlog errors.txt --title "build errors" --notes-file errors.txt --target ${{ github.sha }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Duroosi.app Payload/
          zip -qr Duroosi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Duroosi-IPA
          path: Duroosi.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Duroosi.ipa --title "Duroosi IPA" --notes "Latest build" --target ${{ github.sha }}
